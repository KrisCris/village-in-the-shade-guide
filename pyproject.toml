[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "honogurashi-extractor"
version = "0.1.0"
description = "Read-only data extractor for Village in the Shade"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "texture2ddecoder>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
honogurashi-data = "honogurashi_extractor.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
